name: Deploy to GitHub Pages

# GitHub Pages serves this site from the gh-pages branch.
# Every push to main runs the tests and, if they pass, publishes main to gh-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish main to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
